name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: Assemble debug + release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate a signing key
        # Self-signed key so the release APK is installable on a TV.
        # Replace with your own keystore (as repo secrets) if you plan to publish updates.
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/bravetube.jks" \
            -storepass bravetube -keypass bravetube \
            -alias bravetube -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=BraveTube, OU=TV, O=BraveTube, C=IN"

      - name: Build APKs
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/bravetube.jks
          KEYSTORE_PASSWORD: bravetube
          KEY_ALIAS: bravetube
          KEY_PASSWORD: bravetube
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name "*.apk" -exec cp {} dist/ \;
          ls -lh dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: BraveTube-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
